name: Los Olmos iOS 9 IPA
on:
  push:
    branches: [olmos-kiosk]
    paths: [OlmosKiosk/**, scripts/build-olmos.sh, scripts/verify-olmos-ipa.py, .github/workflows/olmos-ios9.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned upstream legacy SDK stubs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/legacy-sdk"
          gh release download xcode13-sdk-stubs-v1 --repo ha-dashboard/ios-app --pattern iPhoneOS-armv7-stubs.tar.gz --dir "$RUNNER_TEMP/legacy-sdk"
          cd "$RUNNER_TEMP/legacy-sdk"
          echo '7b89a8882d60246b0ba53ed4a61363a0cbcad648e5b36874940bf4ee400c2dfc  iPhoneOS-armv7-stubs.tar.gz' | shasum -a 256 -c -
          tar xzf iPhoneOS-armv7-stubs.tar.gz
          echo "XCODE13_SDK_PATH=$RUNNER_TEMP/legacy-sdk/iPhoneOS.sdk" >> "$GITHUB_ENV"
      - name: Compile armv7 and arm64, package and verify IPA
        run: bash scripts/build-olmos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Los-Olmos-iOS9-IPA
          path: |
            build/olmos/Los-Olmos-iOS9-unsigned.ipa
            build/olmos/SHA256SUMS.txt
          if-no-files-found: error
